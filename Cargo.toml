[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/codewic/sotto"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Unoptimized image decoding is many times slower than a release build, which made photos crawl
# on dev desks. Dev builds optimize just the image path.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.sotto-review]
opt-level = 2
