name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox and document tools for safe-review tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap poppler-utils libreoffice-writer-nogui
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace -- -D warnings

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  reproducible:
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: bash scripts/reproducible-build.sh
