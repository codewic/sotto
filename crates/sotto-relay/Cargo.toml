[package]
name = "sotto-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3.34"
postcard = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
sotto-core = { version = "0.2.0", path = "../sotto-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "signal"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"
