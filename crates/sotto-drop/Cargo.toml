[package]
name = "sotto-drop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
postcard = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sotto-core = { version = "0.2.3", path = "../sotto-core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "io-util"] }
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
postcard = "1.1.3"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
