[package]
name = "sotto-call-broker"
description = "Hands out short-lived join tokens for throwaway call rooms on a self-hosted LiveKit server. Keeps no records."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom = "0.4.3"
livekit-token = "0.4.0"
livekit-protocol = "0.8.2"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
# For the smoke test that joins a real LiveKit server.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
prost = "0.14"
