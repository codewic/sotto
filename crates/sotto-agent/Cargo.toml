[package]
name = "sotto-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
postcard = "1.1.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["socks", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sotto-cases = { version = "0.2.1", path = "../sotto-cases" }
sotto-client = { version = "0.2.1", path = "../sotto-client" }
sotto-core = { version = "0.2.1", path = "../sotto-core" }
sotto-directory = { version = "0.2.1", path = "../sotto-directory" }
sotto-drop = { version = "0.2.1", path = "../sotto-drop" }
sotto-review = { version = "0.2.1", path = "../sotto-review" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sotto-vault = { version = "0.2.1", path = "../sotto-vault" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "signal", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
postcard = "1.1.3"
serde_json = "1.0.154"
sotto-relay = { path = "../sotto-relay" }
tempfile = "3.27.0"
tower = "0.5.3"
