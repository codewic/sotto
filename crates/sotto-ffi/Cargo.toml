[package]
name = "sotto-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
serde_json = "1.0.154"
sotto-client = { version = "0.2.0", path = "../sotto-client" }
sotto-core = { version = "0.2.0", path = "../sotto-core" }
sotto-vault = { version = "0.2.0", path = "../sotto-vault" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uniffi = { version = "0.32", features = ["cli"] }
