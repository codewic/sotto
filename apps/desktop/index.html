    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />

    <title>Sotto</title>
    <style id="splash-style">
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--splash-bg, #f3f3f3); z-index: 9999; transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1); }
      #splash svg path { stroke: var(--splash-ink, #5b47c7); stroke-dasharray: 120; stroke-dashoffset: 120; animation: splash-draw 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash svg path { animation: none; stroke-dashoffset: 0; } }
    </style>
    <script src="./splash.js"></script>
  </head>

      </svg>
    </div>
