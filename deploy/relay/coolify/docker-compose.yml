# Sotto relay for Coolify. Paste this whole file into Coolify: New Resource, Docker Compose
# Empty. Setup steps are in README.md next to this file. Generated by make.py for v0.2.3;
# don't edit by hand.
#
# The image installs sotto-relay from the signed v0.2.3 release: the archive's SHA-256 below
# comes from that release's manifest, whose signature make.py checked against the Sotto
# release key, and the build stops if the download doesn't match it.

services:
  relay:
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim AS fetch
        RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
        RUN curl -fsSL -o /tmp/tools.tar.gz https://github.com/codewic/sotto-releases/releases/download/v0.2.3/sotto-tools-0.2.3-x86_64.tar.gz \
         && echo "2946be8d3d825cc167dabe091ccb38158b20fb7255a3712c2532dba367d4d9ba  /tmp/tools.tar.gz" | sha256sum -c - \
         && tar -xzf /tmp/tools.tar.gz -C /tmp sotto-relay \
         && mkdir -p /data && chown 65532:65532 /data

        # Distroless: no shell, runs as a non-root user.
        FROM gcr.io/distroless/cc-debian12:nonroot
        COPY --from=fetch /tmp/sotto-relay /usr/local/bin/sotto-relay
        COPY --from=fetch --chown=65532:65532 /data /data
        USER nonroot
        EXPOSE 7400
        ENTRYPOINT ["/usr/local/bin/sotto-relay", "--listen", "0.0.0.0:7400", "--data-dir", "/data", "--max-mb", "2048"]
    volumes:
      # Mailbox and group ids, their public keys and time limits, and sealed insurance packages.
      # Message content is held in memory only.
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  relay-data:
