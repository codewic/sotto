# Sotto relay for Coolify. Paste this whole file into Coolify: New Resource, Docker Compose
# Empty. Setup steps are in README.md next to this file. Generated by make.py for v0.2.5;
# don't edit by hand.
#
# The image installs sotto-relay from the signed v0.2.5 release, picking the build for the
# server's processor (x86_64 or ARM). Each archive's SHA-256 below comes from that release's
# manifest, whose signature make.py checked against the Sotto release key, and the build stops
# if the download doesn't match it.

services:
  relay:
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim AS fetch
        RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
        # No dollar signs in this file: Compose and Coolify would substitute them before the build.
        RUN if uname -m | grep -qx x86_64; then \
              curl -fsSL -o /tmp/tools.tar.gz https://github.com/codewic/sotto-releases/releases/download/v0.2.5/sotto-tools-0.2.5-x86_64.tar.gz \
              && echo "70d7325150c7ba5179583e5db82127b3c905cd5fb1172fd4646c953543af9ad9  /tmp/tools.tar.gz" | sha256sum -c -; \
            elif uname -m | grep -qxE "aarch64|arm64"; then \
              curl -fsSL -o /tmp/tools.tar.gz https://github.com/codewic/sotto-releases/releases/download/v0.2.5/sotto-tools-0.2.5-aarch64.tar.gz \
              && echo "c71e857276e751a1b28ed99687c0c48fdbf494c2abfb96b2e28769defe8b384a  /tmp/tools.tar.gz" | sha256sum -c -; \
            else \
              echo "Sotto's relay has no build for this processor" && uname -m && exit 1; \
            fi \
         && tar -xzf /tmp/tools.tar.gz -C /tmp sotto-relay \
         && mkdir -p /data && chown 65532:65532 /data

        # Distroless: no shell, runs as a non-root user.
        FROM gcr.io/distroless/cc-debian12:nonroot
        COPY --from=fetch /tmp/sotto-relay /usr/local/bin/sotto-relay
        COPY --from=fetch --chown=65532:65532 /data /data
        USER nonroot
        EXPOSE 7400
        ENTRYPOINT ["/usr/local/bin/sotto-relay", "--listen", "0.0.0.0:7400", "--data-dir", "/data", "--max-mb", "2048"]
    volumes:
      # Mailbox and group ids, their public keys and time limits, and sealed insurance packages.
      # Message content is held in memory only.
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  relay-data:
